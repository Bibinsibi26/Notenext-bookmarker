<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextNote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <!-- ═══ HEADER ═══ -->
  <header class="popup-header">
    <div class="popup-logo">
      <div class="popup-logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3Z"
            stroke="url(#g1)" stroke-width="2" fill="none" />
          <path d="M9 3V15L12 12L15 15V3" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#00d9c8" />
              <stop offset="100%" stop-color="#6366f1" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="popup-logo-text">TabVault</span>
    </div>
    <a class="popup-open-dashboard" id="openDashboardBtn" href="#" title="Open full dashboard">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" />
        <polyline points="15 3 21 3 21 9" />
        <line x1="10" y1="14" x2="21" y2="3" />
      </svg>
      Dashboard
    </a>
  </header>

  <!-- ═══ CURRENT TAB STATUS ═══ -->
  <div class="current-tab-status" id="currentTabStatus">
    <div class="status-spinner" id="statusSpinner"></div>
    <div class="status-content" id="statusContent" style="display:none">
      <div class="status-favicon-wrap">
        <img class="status-favicon" id="statusFavicon" src="" alt="">
      </div>
      <div class="status-info">
        <div class="status-title" id="statusTitle">Loading…</div>
        <div class="status-url" id="statusUrl"></div>
      </div>
      <div class="status-saved-badge" id="statusSavedBadge" style="display:none">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M20 6L9 17l-5-5" />
        </svg>
        Saved
      </div>
    </div>
  </div>

  <!-- ═══ SAVE FORM ═══ -->
  <div class="popup-form" id="popupForm">
    <div class="form-group">
      <input type="text" class="form-input" id="popupTitle" placeholder="Title" autocomplete="off">
    </div>

    <div class="form-row">
      <select class="form-input form-select" id="popupFolder">
        <option value="">No folder</option>
      </select>
      <div class="tags-input-wrapper compact" id="popupTagsWrapper">
        <input type="text" class="tags-input" id="popupTags" placeholder="Tags…" autocomplete="off">
        <div class="popup-tags-chips" id="popupTagsChips"></div>
      </div>
    </div>

    <textarea class="form-input form-textarea" id="popupNotes" placeholder="Notes (optional)…" rows="2"></textarea>

    <div class="form-checkbox-row">
      <label class="checkbox-label">
        <input type="checkbox" id="popupPinned" class="checkbox-input">
        <span class="checkbox-custom"></span>
        <span>Pin bookmark</span>
      </label>
    </div>

    <button class="btn-save" id="popupSaveBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z" />
        <polyline points="17 21 17 13 7 13 7 21" />
        <polyline points="7 3 7 8 15 8" />
      </svg>
      Save to TabVault
    </button>
  </div>

  <!-- ═══ ALREADY SAVED STATE ═══ -->
  <div class="saved-state" id="savedState" style="display:none">
    <div class="saved-check">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M20 6L9 17l-5-5" />
      </svg>
    </div>
    <p class="saved-text">Already in your library!</p>
    <div class="saved-actions">
      <button class="btn-secondary-sm" id="savedEditBtn">Edit</button>
      <button class="btn-danger-sm" id="savedDeleteBtn">Remove</button>
    </div>
  </div>

  <!-- ═══ RECENT BOOKMARKS ═══ -->
  <div class="popup-recents" id="popupRecents">
    <div class="recents-header">
      <span class="recents-label">Recent Saves</span>
    </div>
    <div class="recents-list" id="recentsList">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- ═══ FOOTER ═══ -->
  <div class="popup-footer">
    <span class="footer-stat" id="footerStat">0 bookmarks</span>
    <span class="footer-shortcut"><kbd>Alt+S</kbd> Quick save</span>
  </div>

  <div class="popup-toast" id="popupToast" style="display:none"></div>

  <script type="module" src="popup.js"></script>
</body>

</html>
